<!-- Google Sites: Insert → Embed → Embed code. Suggested height: 600 px.
     Copy one <li> block per publication. Newest first. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --accent:#1d4ed8; --bg:#ffffff; }
  * { box-sizing:border-box; }
  body { margin:0; padding:8px 4px; background:var(--bg); color:var(--ink);
         font-family:"Roboto","Segoe UI",Arial,sans-serif; line-height:1.5; }
  h3 { font-size:15px; margin:18px 0 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  ol { margin:0; padding-left:22px; }
  li { padding:10px 0; border-bottom:1px solid var(--line); }
  .title { font-weight:600; }
  .venue { font-style:italic; }
  .meta { color:var(--muted); font-size:14px; }
  a { color:var(--accent); text-decoration:none; font-size:14px; }
  a:hover { text-decoration:underline; }
</style>
</head>
<body>
<h3>Journal articles</h3>
<ol reversed>
  <li>

    <div class="meta">[[TODO: Authors, with M. S. Hossain in bold]] · <span class="venue">[[TODO: Journal]]</span>, [[TODO: vol(issue)]], [[TODO: year]]</div>
    <a href="https://doi.org/[[TODO-DOI]]" target="_blank" rel="noopener">DOI ↗</a>

</ol>

  </li>
</ol>
</body>
</html>

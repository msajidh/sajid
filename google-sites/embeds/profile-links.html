<style>
  :root { --ink:#1f2937; --line:#d1d5db; --accent:#1d4ed8; --bg:#ffffff; }
  * { box-sizing:border-box; }
  body { margin:0; padding:12px 4px; background:var(--bg); font-family:"Roboto","Segoe UI",Arial,sans-serif; }
  nav { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  a { display:inline-flex; align-items:center; gap:6px; padding:10px 16px; border:1px solid var(--line);
      border-radius:999px; color:var(--ink); text-decoration:none; font-size:14px; font-weight:500; }
  a:hover, a:focus-visible { border-color:var(--accent); color:var(--accent); }
</style>

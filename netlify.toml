# Netlify configuration: https://docs.netlify.com/configure-builds/file-based-configuration/
[build]
  command = "bash scripts/build.sh"
  publish = "dist"

# Old Google Sites-style paths (e.g. /view/mdsajidhossain/home) → new pages
[[redirects]]
  from = "/view/mdsajidhossain/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Serve MATLAB code as readable text in the browser
[[headers]]
  for = "/teaching/matlab/*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
